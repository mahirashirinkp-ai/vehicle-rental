<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Vehicle - VRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4ff; }
        .summary-card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .price-big { font-size: 2rem; font-weight: 700; color: #1565c0; }
        #cost-preview { display: none; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-car-front-fill me-2"></i>VRMS</a>
        <a href="/vehicles" class="btn btn-outline-light">Back to Vehicles</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="summary-card p-4 mb-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-car-front text-primary me-2"></i>Vehicle Summary</h4>
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <img th:src="${vehicle.imageUrl != null ? vehicle.imageUrl : 'https://via.placeholder.com/300x180?text=' + vehicle.name}"
                             class="img-fluid rounded" th:alt="${vehicle.name}">
                    </div>
                    <div class="col-md-8 mt-3 mt-md-0">
                        <h3 th:text="${vehicle.name}" class="fw-bold"></h3>
                        <p class="text-muted mb-1"><i class="bi bi-tag me-1"></i><span th:text="${vehicle.brand}"></span>
                            &bull; <span th:text="${vehicle.type}"></span></p>
                        <p th:text="${vehicle.description}" class="text-muted"></p>
                        <div class="price-big">₹<span th:text="${vehicle.pricePerDay}"></span> <small class="text-muted fs-6 fw-normal">/ day</small></div>
                    </div>
                </div>
            </div>

            <div class="summary-card p-4">
                <h4 class="fw-bold mb-4"><i class="bi bi-calendar-check text-primary me-2"></i>Select Rental Dates</h4>

                <form th:action="@{/book/{id}(id=${vehicle.id})}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Pick-up Date</label>
                            <input type="date" name="startDate" id="startDate" class="form-control form-control-lg"
                                   th:min="${today}" required onchange="calcCost()">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Return Date</label>
                            <input type="date" name="endDate" id="endDate" class="form-control form-control-lg"
                                   th:min="${today}" required onchange="calcCost()">
                        </div>
                    </div>

                    <div id="cost-preview" class="alert alert-primary mt-4">
                        <div class="d-flex justify-content-between">
                            <span><strong id="days-count">0</strong> days &times; ₹<span th:text="${vehicle.pricePerDay}"></span>/day</span>
                            <strong>Total: ₹<span id="total-cost">0</span></strong>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">
                        <i class="bi bi-calendar-check me-2"></i>Submit Booking Request
                    </button>
                    <p class="text-muted text-center small mt-2">
                        <i class="bi bi-info-circle me-1"></i>Your booking will be reviewed by admin before confirmation.
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
const pricePerDay = /*[[${vehicle.pricePerDay}]]*/ 0;

function calcCost() {
    const s = document.getElementById('startDate').value;
    const e = document.getElementById('endDate').value;
    if (s && e && e > s) {
        const days = Math.round((new Date(e) - new Date(s)) / 86400000);
        document.getElementById('days-count').textContent = days;
        document.getElementById('total-cost').textContent = (days * pricePerDay).toLocaleString('en-IN');
        document.getElementById('cost-preview').style.display = 'block';
    } else {
        document.getElementById('cost-preview').style.display = 'none';
    }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
