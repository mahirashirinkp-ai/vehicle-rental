<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4ff; }
        .card { border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #1a237e, #1565c0); border-radius: 16px 16px 0 0 !important; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0">
                <div class="card-header text-white text-center py-4">
                    <h3><i class="bi bi-person-plus-fill me-2"></i>Create Account</h3>
                    <p class="mb-0 opacity-75">Register to start booking vehicles</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/register}" th:object="${customer}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control form-control-lg" th:field="*{fullName}"
                                   placeholder="Your full name" required>
                            <div class="text-danger small mt-1" th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control form-control-lg" th:field="*{email}"
                                   placeholder="you@example.com" required>
                            <div class="text-danger small mt-1" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control form-control-lg" th:field="*{phone}"
                                   placeholder="10-digit mobile number" required>
                            <div class="text-danger small mt-1" th:errors="*{phone}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control form-control-lg" th:field="*{password}"
                                   placeholder="Minimum 6 characters" required>
                            <div class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">Register</button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">Already have an account? <a href="/login">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
