<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Vehicles - VRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .vehicle-card { border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .vehicle-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .vehicle-card img { height: 200px; object-fit: cover; border-radius: 12px 12px 0 0; }
        .badge-type { background: #e3f2fd; color: #1565c0; font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; }
        .price-tag { font-size: 1.5rem; font-weight: 700; color: #1565c0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-car-front-fill me-2"></i>VRMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/vehicles">Vehicles</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/my-rentals">My Bookings</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin"><i class="bi bi-shield-check"></i> Admin</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-light ms-2" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="bi bi-car-front me-2 text-primary"></i>Available Vehicles</h2>

    <div th:if="${#lists.isEmpty(vehicles)}" class="alert alert-info">
        No vehicles available at the moment. Check back soon!
    </div>

    <div class="row g-4">
        <div class="col-md-4 col-sm-6" th:each="vehicle : ${vehicles}">
            <div class="card vehicle-card h-100">
                <img th:src="${vehicle.imageUrl != null ? vehicle.imageUrl : 'https://via.placeholder.com/400x200?text=' + vehicle.name}"
                     th:alt="${vehicle.name}" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0 fw-bold" th:text="${vehicle.name}"></h5>
                        <span class="badge-type" th:text="${vehicle.type}"></span>
                    </div>
                    <p class="text-muted small mb-2"><i class="bi bi-tag me-1"></i><span th:text="${vehicle.brand}"></span></p>
                    <p class="text-muted small flex-grow-1" th:text="${vehicle.description}"></p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div>
                            <span class="price-tag">₹<span th:text="${vehicle.pricePerDay}"></span></span>
                            <span class="text-muted small">/day</span>
                        </div>
                        <a th:href="@{/book/{id}(id=${vehicle.id})}" class="btn btn-primary"
                           sec:authorize="isAuthenticated()">
                            <i class="bi bi-calendar-plus me-1"></i>Book Now
                        </a>
                        <a href="/login" class="btn btn-outline-primary" sec:authorize="isAnonymous()">
                            Login to Book
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
