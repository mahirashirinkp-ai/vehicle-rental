<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - VRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-car-front-fill me-2"></i>VRMS</a>
        <div class="d-flex gap-2">
            <a href="/vehicles" class="btn btn-outline-light">Browse Vehicles</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-danger" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="bi bi-journal-check text-primary me-2"></i>My Bookings</h2>

    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${#lists.isEmpty(rentals)}" class="text-center py-5">
        <i class="bi bi-calendar-x text-muted" style="font-size:4rem"></i>
        <p class="mt-3 text-muted fs-5">You have no bookings yet.</p>
        <a href="/vehicles" class="btn btn-primary mt-2">Book a Vehicle</a>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(rentals)}">
        <div class="col-md-6" th:each="rental : ${rentals}">
            <div class="card border-0 shadow-sm rounded-3 h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="fw-bold" th:text="${rental.vehicle.name}"></h5>
                        <span th:text="${rental.status}"
                              th:classappend="${rental.status == 'APPROVED'} ? 'bg-success' :
                                             (${rental.status == 'PENDING'} ? 'bg-warning text-dark' :
                                             (${rental.status == 'REJECTED'} ? 'bg-danger' : 'bg-secondary'))"
                              class="badge rounded-pill"></span>
                    </div>
                    <p class="text-muted small mb-2">
                        <i class="bi bi-tag me-1"></i><span th:text="${rental.vehicle.brand}"></span> &bull;
                        <span th:text="${rental.vehicle.type}"></span>
                    </p>
                    <div class="row text-center mt-3">
                        <div class="col-4 border-end">
                            <small class="text-muted d-block">Pick-up</small>
                            <strong th:text="${rental.startDate}"></strong>
                        </div>
                        <div class="col-4 border-end">
                            <small class="text-muted d-block">Return</small>
                            <strong th:text="${rental.endDate}"></strong>
                        </div>
                        <div class="col-4">
                            <small class="text-muted d-block">Total</small>
                            <strong class="text-primary">₹<span th:text="${rental.totalCost}"></span></strong>
                        </div>
                    </div>
                    <div th:if="${rental.adminNote != null and !rental.adminNote.isEmpty()}"
                         class="alert alert-light mt-3 mb-0 small">
                        <i class="bi bi-chat-text me-1"></i><strong>Admin note:</strong>
                        <span th:text="${rental.adminNote}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
