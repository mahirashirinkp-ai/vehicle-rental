<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Form - VRMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style> body { background: #f8f9fa; } </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin"><i class="bi bi-arrow-left me-2"></i>Back to Admin</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0"><i class="bi bi-car-front me-2"></i>
                        <span th:text="${vehicle.id != null ? 'Edit Vehicle' : 'Add New Vehicle'}"></span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/vehicle/save}" th:object="${vehicle}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Vehicle Name</label>
                                <input type="text" class="form-control" th:field="*{name}"
                                       placeholder="e.g. Toyota Innova" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Brand</label>
                                <input type="text" class="form-control" th:field="*{brand}"
                                       placeholder="e.g. Toyota" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Type</label>
                                <select class="form-select" th:field="*{type}">
                                    <option value="Car">Car</option>
                                    <option value="Bike">Bike</option>
                                    <option value="Van">Van</option>
                                    <option value="Truck">Truck</option>
                                    <option value="SUV">SUV</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Price Per Day (₹)</label>
                                <input type="number" class="form-control" th:field="*{pricePerDay}"
                                       placeholder="e.g. 1500" min="1" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Image URL (optional)</label>
                                <input type="url" class="form-control" th:field="*{imageUrl}"
                                       placeholder="https://example.com/car.jpg">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea class="form-control" th:field="*{description}" rows="3"
                                          placeholder="Brief description of the vehicle"></textarea>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{available}" id="avail">
                                    <label class="form-check-label" for="avail">Available for booking</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-check-circle me-2"></i>Save Vehicle
                            </button>
                            <a href="/admin" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
